name: Build Weather HTML

on:
  push:
    paths:
      - weather.json

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node generate.js

      - name: Commit HTML
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add index.html

          git diff --staged --quiet || git commit -m "Update weather HTML"

          git push
