<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Weather Search</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #87ceeb;
    padding: 20px;
}

.weather-box {
    background: rgba(255,255,255,0.8);
    padding: 20px;
    border-radius: 10px;
    max-width: 600px;
    margin: auto;
}

input {
    padding: 8px;
    width: 220px;
}

button {
    padding: 8px 12px;
    cursor: pointer;
}

.day {
    margin: 8px 0;
}

#suggestions {
    width: 220px;
    margin: 0 auto;
    background: white;
    border: 1px solid #ccc;
    border-top: none;
}

.suggestion {
    padding: 8px;
    cursor: pointer;
    text-align: left;
}

.suggestion:hover {
    background: #eeeeee;
}
</style>

</head>
<body>

<div class="weather-box">

    <h1>Weather Search</h1>

    <input
        id="city"
        type="text"
        placeholder="Enter city"
        autocomplete="off"
    >

    <button onclick="searchWeather()">Search</button>

    <div id="suggestions"></div>

    <h2 id="location"></h2>

    <p id="temp"></p>

    <h3>7-Day Rain Chance</h3>

    <div id="forecast"></div>

</div>

<script>

const cityInput = document.getElementById("city");
const suggestions = document.getElementById("suggestions");

/* Enter Key Support */
cityInput.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        searchWeather();
    }
});

/* Autocomplete Search */
cityInput.addEventListener("input", async () => {

    const query = cityInput.value.trim();

    if (query.length < 2) {
        suggestions.innerHTML = "";
        return;
    }

    try {

        const response = await fetch(
            `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5`
        );

        const data = await response.json();

        suggestions.innerHTML = "";

        if (!data.results) return;

        data.results.forEach(place => {

            const div = document.createElement("div");

            div.className = "suggestion";

            div.textContent =
                `${place.name}, ${place.country}`;

            div.onclick = () => {

                cityInput.value = place.name;

                suggestions.innerHTML = "";

                searchWeather();
            };

            suggestions.appendChild(div);

        });

    } catch (error) {
        console.error(error);
    }

});

/* Weather Search */
async function searchWeather() {

    const city = cityInput.value.trim();

    if (!city) return;

    try {

        const geoResponse = await fetch(
            `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`
        );

        const geoData = await geoResponse.json();

        if (!geoData.results || geoData.results.length === 0) {
            alert("Location not found");
            return;
        }

        const place = geoData.results[0];

        const weatherResponse = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m&daily=precipitation_probability_max&temperature_unit=fahrenheit&forecast_days=7`
        );

        const weatherData = await weatherResponse.json();

        document.getElementById("location").textContent =
            `${place.name}, ${place.country}`;

        document.getElementById("temp").textContent =
            `Temperature: ${weatherData.current.temperature_2m}°F`;

        let forecastHTML = "";

        weatherData.daily.time.forEach((date, index) => {

            forecastHTML += `
                <div class="day">
                    <strong>${date}</strong>
                    - Rain Chance:
                    ${weatherData.daily.precipitation_probability_max[index]}%
                </div>
            `;

        });

        document.getElementById("forecast").innerHTML = forecastHTML;

    } catch (error) {

        console.error(error);

        alert("Failed to get weather data.");

    }

}

</script>

</body>
</html>
