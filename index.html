<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Weather Info</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #87ceeb;
            color: #fff;
            padding-top: 50px;
        }

        .weather-box {
            background: rgba(0,0,0,0.2);
            display: inline-block;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
        }
    </style>
</head>
<body>

<div class="weather-box">
    <h1>Weather Info</h1>

    <p><strong>Location:</strong> <span id="location">Loading...</span></p>
    <p><strong>Temperature:</strong> <span id="temp">--</span> °F</p>
    <p><strong>Wind Speed:</strong> <span id="wind">--</span> mph</p>
</div>

<script>
async function getWeather() {
    try {
        const response = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=36.16&longitude=-86.78&current=temperature_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph"
        );

        const data = await response.json();

        document.getElementById("location").textContent = "Nashville, TN";
        document.getElementById("temp").textContent =
            data.current.temperature_2m;
        document.getElementById("wind").textContent =
            data.current.wind_speed_10m;

    } catch (err) {
        console.error(err);
        document.getElementById("location").textContent = "Error loading weather";
    }
}

getWeather();
</script>

</body>
</html>
